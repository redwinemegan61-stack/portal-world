<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Lantern Runner · Portal World</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#050A24;touch-action:none}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script>
<script src="../../03-world/kit/portal-kit.js"></script>
</head><body>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const touch = matchMedia("(pointer:coarse)").matches;
const renderer = new THREE.WebGLRenderer({ antialias: !touch });
renderer.setPixelRatio(Math.min(devicePixelRatio, touch ? 1.25 : 1.6)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x060B2A); scene.fog = new THREE.Fog(0x0B1240, 25, 110);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 300);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.5, 0.6)); composer.addPass(new OutputPass());
scene.add(new THREE.HemisphereLight(0x8fa8ff, 0x2a1a5a, 1.4));

const LANES = [-2.4, 0, 2.4], SEG = 12, SEGS = 12;
const GOLD = 0xFFC857, PINK = 0xFF2E9A, TEAL = 0x19E3D1, VIOLET = 0x8B5CF6, CYAN = 0x3EF2FF;

/* sky stars */
{ const n = 900, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { p[i*3] = (Math.random()-0.5)*400; p[i*3+1] = 10 + Math.random()*120; p[i*3+2] = -60 - Math.random()*200; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbcd6ff, size: 0.7, fog: false }))); }

/* track segments (recycled) */
const segs = [];
const pathMat = new THREE.MeshStandardMaterial({ color: 0x1a2350, metalness: 0.4, roughness: 0.6, emissive: 0x0a0f30 });
const edgeMat = new THREE.MeshBasicMaterial({ color: GOLD });
const laneMat = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.35 });
const grassMat = new THREE.MeshStandardMaterial({ color: 0x1B4A5E, roughness: 1 });
const trunkGeo = new THREE.CylinderGeometry(0.15, 0.35, 3.5, 6); trunkGeo.translate(0, 1.75, 0);
const crownGeo = new THREE.IcosahedronGeometry(1.5, 0); crownGeo.translate(0, 4.3, 0);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x9aa6c8, metalness: 0.8, roughness: 0.3 });
const crownMats = [PINK, TEAL, VIOLET, CYAN].map(c => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(0.85), transparent: true, opacity: 0.9 }));
for (let i = 0; i < SEGS; i++) {
  const g = new THREE.Group();
  const path = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, SEG), pathMat); path.position.y = -0.15; g.add(path);
  [-4, 4].forEach(x => { const e = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, SEG), edgeMat); e.position.set(x, 0.06, 0); g.add(e); });
  [-1.2, 1.2].forEach(x => { const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, SEG * 0.6), laneMat); l.position.set(x, 0.01, 0); g.add(l); });
  [-1, 1].forEach(s => { const gr = new THREE.Mesh(new THREE.BoxGeometry(40, 0.2, SEG), grassMat); gr.position.set(s * 24, -0.4, 0); g.add(gr);
    for (let k = 0; k < 2; k++) { const t = new THREE.Group(); t.add(new THREE.Mesh(trunkGeo, trunkMat), new THREE.Mesh(crownGeo, crownMats[(Math.random()*4)|0]));
      t.position.set(s * (7 + Math.random() * 14), -0.3, (Math.random() - 0.5) * SEG); t.scale.setScalar(0.7 + Math.random() * 0.8); t.rotation.y = Math.random() * 6; g.add(t); } });
  g.position.z = -i * SEG; scene.add(g); segs.push(g);
}
/* glowing flowers drifting by */
const flowerN = 500, fp = new Float32Array(flowerN * 3), fc = new Float32Array(flowerN * 3);
for (let i = 0; i < flowerN; i++) { const s = Math.random() < 0.5 ? -1 : 1; fp[i*3] = s * (4.6 + Math.random() * 18); fp[i*3+1] = 0.1 + Math.random() * 0.3; fp[i*3+2] = -Math.random() * SEG * SEGS;
  const c = new THREE.Color([PINK, TEAL, VIOLET, CYAN][i % 4]); fc[i*3] = c.r; fc[i*3+1] = c.g; fc[i*3+2] = c.b; }
const fGeo = new THREE.BufferGeometry(); fGeo.setAttribute("position", new THREE.BufferAttribute(fp, 3)); fGeo.setAttribute("color", new THREE.BufferAttribute(fc, 3));
scene.add(new THREE.Points(fGeo, new THREE.PointsMaterial({ size: 0.35, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

/* the lantern (player) */
const lantern = new THREE.Group();
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 1), new THREE.MeshBasicMaterial({ color: GOLD }));
const cage = new THREE.Mesh(new THREE.OctahedronGeometry(0.62, 0), new THREE.MeshBasicMaterial({ color: 0xffe7a8, wireframe: true }));
const halo = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.03, 8, 40), new THREE.MeshBasicMaterial({ color: GOLD }));
halo.rotation.x = Math.PI / 2; lantern.add(core, cage, halo);
const glow = new THREE.PointLight(GOLD, 10, 9, 2); glow.position.y = 0.3; lantern.add(glow);
scene.add(lantern);
const trailN = 40, tp = new Float32Array(trailN * 3), trail = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: GOLD, size: 0.18, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
trail.geometry.setAttribute("position", new THREE.BufferAttribute(tp, 3)); scene.add(trail);

/* obstacles + orbs (pooled) */
const crystalGeo = new THREE.ConeGeometry(0.75, 1.3, 5); crystalGeo.translate(0, 0.65, 0);
const crystalMat = new THREE.MeshStandardMaterial({ color: PINK, emissive: PINK, emissiveIntensity: 0.8, flatShading: true, metalness: 0.3, roughness: 0.3 });
const archBarGeo = new THREE.BoxGeometry(2.2, 0.5, 0.5), archPostGeo = new THREE.BoxGeometry(0.25, 2.6, 0.4);
const archMat = new THREE.MeshStandardMaterial({ color: VIOLET, emissive: VIOLET, emissiveIntensity: 0.9 });
const wallGeo = new THREE.BoxGeometry(2, 3, 0.8); const wallMat = new THREE.MeshStandardMaterial({ color: 0xC9CED6, metalness: 0.85, roughness: 0.35, emissive: 0x19E3D1, emissiveIntensity: 0.15 });
const orbGeo = new THREE.OctahedronGeometry(0.28, 0), orbMat = new THREE.MeshBasicMaterial({ color: 0xFFE08A });
const items = [];
function makeObstacle(type, lane, z) {
  const g = new THREE.Group();
  if (type === "crystal") { g.add(new THREE.Mesh(crystalGeo, crystalMat)); const c2 = new THREE.Mesh(crystalGeo, crystalMat); c2.scale.set(0.5, 0.7, 0.5); c2.position.set(0.55, 0, 0.2); g.add(c2); }
  if (type === "arch") { const b = new THREE.Mesh(archBarGeo, archMat); b.position.y = 1.6; g.add(b); [-1, 1].forEach(s => { const p = new THREE.Mesh(archPostGeo, archMat); p.position.set(s * 1.05, 1.3, 0); g.add(p); }); }
  if (type === "wall") { const w = new THREE.Mesh(wallGeo, wallMat); w.position.y = 1.5; g.add(w); }
  g.position.set(LANES[lane], 0, z); scene.add(g); items.push({ kind: type, lane, obj: g, z });
}
function makeOrb(lane, z, y) { const m = new THREE.Mesh(orbGeo, orbMat); m.position.set(LANES[lane], y, z); scene.add(m); items.push({ kind: "orb", lane, obj: m, z, y }); }
let nextRowZ;
function spawnRow(z) {
  const free = (Math.random() * 3) | 0, row = [0, 1, 2].filter(l => l !== free);
  const blocked = Math.random() < Math.min(0.75, 0.35 + dist / 3000) ? row : [row[(Math.random() * 2) | 0]];
  blocked.forEach(l => { const r = Math.random(); makeObstacle(r < 0.4 ? "crystal" : r < 0.75 ? "arch" : "wall", l, z); });
  for (let k = 0; k < 5; k++) makeOrb(free, z + 3 + k * 1.6, 0.8);
}

/* game state */
let lane, x, y, vy, slideT, speed, dist, orbs, alive, shake = 0;
function reset() {
  items.forEach(i => scene.remove(i.obj)); items.length = 0;
  lane = 1; x = 0; y = 0; vy = 0; slideT = 0; speed = 14; dist = 0; orbs = 0; alive = true; nextRowZ = -30;
  for (let z = -30; z > -110; z -= 18) spawnRow(z); nextRowZ = -110 - 18;
}
reset();
function move(dir) {
  if (!PortalKit.isPlaying()) return;
  if (dir === "left" && lane > 0) lane--;
  if (dir === "right" && lane < 2) lane++;
  if (dir === "up" && y <= 0.001) { vy = 9.5; slideT = 0; }
  if (dir === "down") { if (y > 0.05) vy = -16; slideT = 0.75; }
}
addEventListener("keydown", e => { const m = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down" }[e.code]; if (m) { e.preventDefault(); move(m); } });
PortalKit.onSwipe(document, move, 24);

PortalKit.init({
  id: "lantern-runner", title: "Lantern Runner", color: "gold",
  goal: "Carry your lantern through the meadow as far as you can.",
  howTo: ["Swipe or use arrow keys to switch lanes", "Swipe up to jump over crystals", "Swipe down to slide under arches", "Collect sparks for +10 each"],
  formatScore: n => Math.round(n).toLocaleString(),
  onStart: reset,
});

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (PortalKit.isPlaying() && alive) {
    speed = Math.min(34, speed + dt * 0.28);
    const dz = speed * dt; dist += dz;
    segs.forEach(s => { s.position.z += dz; if (s.position.z > SEG) s.position.z -= SEG * SEGS; });
    const fpos = fGeo.attributes.position; for (let i = 0; i < flowerN; i++) { let z = fpos.getZ(i) + dz; if (z > 6) z -= SEG * SEGS; fpos.setZ(i, z); } fpos.needsUpdate = true;
    x += (LANES[lane] - x) * (1 - Math.exp(-dt * 16));
    vy -= 26 * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = 0;
    slideT = Math.max(0, slideT - dt);
    const h = slideT > 0 ? 0.55 : 1.3;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.z += dz; it.obj.position.z = it.z;
      if (it.kind === "orb") it.obj.rotation.y += dt * 4;
      if (it.z > 8) { scene.remove(it.obj); items.splice(i, 1); continue; }
      if (Math.abs(it.z) > 0.7 || Math.abs(LANES[it.lane] - x) > 1.1) continue;
      if (it.kind === "orb") { if (Math.abs(it.y - (y + 0.6)) < 1.0) { orbs++; scene.remove(it.obj); items.splice(i, 1); } continue; }
      const hit = it.kind === "crystal" ? y < 1.15 : it.kind === "arch" ? y + h > 1.35 : true;
      if (hit) { alive = false; shake = 0.4; const sc = Math.round(dist + orbs * 10);
        setTimeout(() => PortalKit.lose(sc, it.kind === "arch" ? "Slide under the arches!" : it.kind === "crystal" ? "Jump over the crystals!" : "Switch lanes around the walls!"), 380); break; }
    }
    nextRowZ += dz; while (nextRowZ > -110) { spawnRow(nextRowZ); nextRowZ -= Math.max(11, 18 - dist / 400); }
    PortalKit.setScore(Math.round(dist + orbs * 10));
    lantern.scale.set(1, slideT > 0 ? 0.55 : 1, 1);
  }
  lantern.position.set(x, 0.75 + y + Math.sin(t * 6) * 0.06 - (slideT > 0 ? 0.3 : 0), 0);
  cage.rotation.y = t * 1.5; halo.rotation.z = t * 2; core.rotation.x = t;
  for (let i = trailN - 1; i > 0; i--) { tp[i*3] = tp[(i-1)*3]; tp[i*3+1] = tp[(i-1)*3+1]; tp[i*3+2] = tp[(i-1)*3+2] + (PortalKit.isPlaying() ? speed * dt : 0); }
  tp[0] = x + (Math.random() - 0.5) * 0.3; tp[1] = lantern.position.y + (Math.random() - 0.5) * 0.3; tp[2] = 0.2; trail.geometry.attributes.position.needsUpdate = true;
  shake = Math.max(0, shake - dt);
  camera.position.set(x * 0.6 + (Math.random() - 0.5) * shake, 3.4 + y * 0.35, 6.5 + (Math.random() - 0.5) * shake);
  camera.lookAt(x * 0.4, 1.2, -8);
  composer.render(); requestAnimationFrame(tick);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
tick();
</script>
