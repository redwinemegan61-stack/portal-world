<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Synapse Dash · Portal World</title>
<!-- Synapse Dash (Portal World, portal 4, periwinkle). Original code by Brand Agent, 2026-11-17. All music and sound are generated live with WebAudio; no audio files, no third-party code. Fonts via Google Fonts (loaded by the kit). -->
<style>
html,body{margin:0;height:100%;background:#050A24;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none}
#probe{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
</style>
</head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="game" aria-label="Synapse Dash"></canvas>
<div id="probe"></div>
<script src="../../03-world/kit/portal-kit.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var bg=$("bg"),bgx=bg.getContext("2d"),cv=$("game"),cx=cv.getContext("2d"),probe=$("probe");
var CYAN="#3EF2FF",PINK="#FF2E9A",VIOLET="#8B5CF6",PERI="#8EA2FF",LIME="#7CFF6B",ORANGE="#FF8A3D",TEAL="#19E3D1";

/* ---------- tuning (world units are tiles) ---------- */
var BPM=120,B=60/BPM,SPEED=8,G=70.4,V0=17.6,R=0.4,TPB=SPEED*B; /* 4 tiles per beat, one jump = one beat of air */
var SECTIONS=[{beat:8,name:"Dendrite",col:CYAN},{beat:40,name:"Axon",col:PINK},{beat:72,name:"Cortex",col:LIME}];
/* Handcrafted level: [beat you jump on, type]. s=spike, d=double spike, g=gap, u=step up, n=step down (no jump). */
var EV=[
 [10,"s"],[14,"s"],[18,"s"],[22,"d"],[26,"s"],[28,"s"],[32,"g"],[36,"s"],[38,"s"],
 [42,"g"],[46,"u"],[49,"s"],[52,"n"],[54,"g"],[57,"s"],[58,"s"],[62,"u"],[65,"u"],[68,"n"],[69,"n"],
 [73,"s"],[74,"s"],[75,"s"],[78,"g"],[80,"d"],[83,"u"],[85,"g"],[88,"n"],[90,"s"],[91,"s"],[93,"d"],[96,"g"],[98,"s"],[100,"d"],[102,"s"]
];
var GATE_BEAT=106,GATEX=GATE_BEAT*TPB,END_BEAT=110;
var solids=[],spikes=[],nodes=[],JUMPS=[],JSET={};
(function build(){
  var steps=[{x:-60,lv:0}],holes=[],lv=0;
  EV.forEach(function(e){var b=e[0],x=b*TPB;
    if(e[1]==="s")spikes.push({x:x+2,b:lv});
    else if(e[1]==="d"){spikes.push({x:x+1.5,b:lv});spikes.push({x:x+2.5,b:lv});}
    else if(e[1]==="g")holes.push([x+.7,x+3.3]);
    else if(e[1]==="u"){lv++;steps.push({x:x+2.2,lv:lv});}
    else if(e[1]==="n"){lv--;steps.push({x:x+1,lv:lv});}
    if(e[1]!=="n"){JUMPS.push(b);JSET[b]=1;}
  });
  steps.push({x:GATEX+80,lv:null});
  for(var i=0;i<steps.length-1;i++){var a=steps[i].x,z=steps[i+1].x,top=steps[i].lv,segs=[[a,z]];
    holes.forEach(function(h){var out=[];segs.forEach(function(s){if(h[1]<=s[0]||h[0]>=s[1]){out.push(s);return;}if(h[0]>s[0])out.push([s[0],h[0]]);if(h[1]<s[1])out.push([h[1],s[1]]);});segs=out;});
    segs.forEach(function(s){solids.push({x0:s[0],x1:s[1],top:top});});}
  solids.forEach(function(s){for(var x=Math.ceil(s.x0/2)*2;x<s.x1;x+=2)nodes.push({x:x,y:s.top});});
})();
function support(x,a){var best=-Infinity;for(var i=0;i<solids.length;i++){var s=solids[i];if(s.x1>x-a&&s.x0<x+a&&s.top>best)best=s.top;}return best;}

/* ---------- state ---------- */
var dpr=1,W=0,H=0,T=40,GY=0,safeB=0,orbImg=null,netImg=null;
var simT=0,x=0,y=R,vy=0,grounded=true,lastGround=0,pressT=-9,held=false,dead=false,won=false,endT=0,camY=0,trail=[],shards=[],pct=0,secIdx=-1,banner=null,flash=0,auto=/autoplay/.test(location.hash),autoI=0,startGuard=0;

/* ---------- audio (generated) ---------- */
var AC=null,bus=null,noise=null,audioBase=0,nextBeat=0;
var CH=[{b:45,n:[57,60,64]},{b:41,n:[53,57,60]},{b:48,n:[55,60,64]},{b:43,n:[55,59,62]}]; /* Am F C G */
function hz(m){return 440*Math.pow(2,(m-69)/12);}
function audioInit(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{AC=new C();}catch(e){AC=null;return;}
    noise=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=noise.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==="suspended")AC.resume();
}
function newBus(){if(!AC)return;if(bus){var old=bus;old.gain.setTargetAtTime(0,AC.currentTime,.04);setTimeout(function(){try{old.disconnect();}catch(e){}},500);}
  var comp=AC.createDynamicsCompressor();bus=AC.createGain();bus.gain.value=.5;bus.connect(comp);comp.connect(AC.destination);}
function env(g,w,peak,att,dec){g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(peak,w+att);g.gain.exponentialRampToValueAtTime(0.0001,w+att+dec);}
function osc(type,f,w,dur,peak,att,dest){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,w);env(g,w,peak,att,dur);o.connect(g);g.connect(dest||bus);o.start(w);o.stop(w+att+dur+.05);return o;}
function nz(w,dur,peak,type,freq,dest){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;f.type=type;f.frequency.value=freq;env(g,w,peak,.002,dur);s.connect(f);f.connect(g);g.connect(dest||bus);s.start(w,Math.random()*.5);s.stop(w+dur+.05);}
function kick(w){var o=osc("sine",150,w,.32,.9,.003);o.frequency.exponentialRampToValueAtTime(42,w+.13);}
function bass(m,w){var o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o.frequency.value=hz(m);f.type="lowpass";f.frequency.setValueAtTime(900,w);f.frequency.exponentialRampToValueAtTime(180,w+.2);env(g,w,.22,.005,.2);o.connect(f);f.connect(g);g.connect(bus);o.start(w);o.stop(w+.3);}
function arp(m,w){var o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type="square";o.frequency.value=hz(m);f.type="lowpass";f.frequency.value=2600;env(g,w,.05,.004,.1);o.connect(f);f.connect(g);g.connect(bus);o.start(w);o.stop(w+.16);}
function pad(ns,w,dur){ns.forEach(function(m){[-6,6].forEach(function(dt){var o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o.frequency.value=hz(m);o.detune.value=dt;f.type="lowpass";f.frequency.value=1400;
  g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(.022,w+.3);g.gain.setValueAtTime(.022,w+dur-.3);g.gain.exponentialRampToValueAtTime(0.0001,w+dur);o.connect(f);f.connect(g);g.connect(bus);o.start(w);o.stop(w+dur+.05);});});}
function cue(m,w){osc("triangle",hz(m),w,.28,.18,.004);osc("sine",hz(m+12),w,.18,.06,.004);}
function sched(k,w){
  if(k>END_BEAT)return;
  if(k>=GATE_BEAT){if(k===GATE_BEAT){pad([57,64,69,72],w,2.6);nz(w,1.2,.25,"highpass",5000);kick(w);}return;}
  var sec=k<8?0:k<40?1:k<72?2:3,ch=CH[Math.floor(k/4)%4];
  kick(w);
  if(sec>=1)nz(w+B/2,.05,.22,"highpass",7000);
  if(sec>=3){nz(w+B/4,.03,.1,"highpass",8000);nz(w+3*B/4,.03,.1,"highpass",8000);}
  if(sec>=2&&k%2===1){nz(w,.16,.45,"bandpass",1800);osc("triangle",190,w,.08,.2,.002);}
  bass(ch.b,w);bass(ch.b+(k%2?12:0),w+B/2);
  if(sec>=2)for(var i=0;i<4;i++)arp(ch.n[(k*4+i)%3]+12+(sec>=3?12:0),w+i*B/4);
  if(sec>=3&&k%4===0)pad(ch.n,w,4*B);
  if(JSET[k])cue(ch.n[k%3]+24,w);
}
function pumpAudio(){if(!AC||!bus||AC.state!=="running"||dead)return;var now=AC.currentTime;
  while(audioBase+nextBeat*B<now+.3&&nextBeat<=END_BEAT){var w=audioBase+nextBeat*B;if(w>=now-.02)sched(nextBeat,Math.max(w,now));nextBeat++;}}
function sfxJump(){if(!AC||!bus||AC.state!=="running")return;var w=AC.currentTime,o=osc("sine",420,w,.09,.08,.003);o.frequency.exponentialRampToValueAtTime(900,w+.08);}
function sfxCrash(){if(!AC||!bus)return;var w=AC.currentTime;nz(w,.5,.6,"lowpass",1200);var o=osc("sawtooth",160,w,.4,.2,.003);o.frequency.exponentialRampToValueAtTime(40,w+.4);}

/* ---------- drawing helpers ---------- */
function rgb(h){var n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function rgba(h,a){var c=rgb(h);return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
function mk(w,h){var c=document.createElement("canvas");c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawBg(){
  var w=bg.width=W,h=bg.height=H,g=bgx,R0=rng(11),i,m=Math.max(w,h);
  var gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#0A1440");gr.addColorStop(1,"#050A24");g.fillStyle=gr;g.fillRect(0,0,w,h);
  function glow(px,py,r,col){var q=g.createRadialGradient(px,py,0,px,py,r);q.addColorStop(0,col);q.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=q;g.fillRect(px-r,py-r,2*r,2*r);}
  glow(w*.85,h*.15,m*.5,"rgba(139,92,246,.22)");glow(w*.1,h*.9,m*.45,"rgba(62,242,255,.12)");glow(w*.5,h*.2,m*.35,"rgba(255,46,154,.08)");
  g.save();g.globalCompositeOperation="lighter";g.translate(w*.5,h*.45);g.rotate(-0.6);
  [[VIOLET,-.3,.16],[CYAN,-.1,.10],[LIME,.06,.06],[PINK,.28,.07]].forEach(function(b){var bw=m*.22,bx=b[1]*m,q=g.createLinearGradient(bx-bw/2,0,bx+bw/2,0);q.addColorStop(0,"rgba(0,0,0,0)");q.addColorStop(.5,rgba(b[0],b[2]));q.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=q;g.fillRect(bx-bw/2,-m,bw,2*m);});
  g.restore();
  var s=30*dpr,hw=Math.sqrt(3)*s;g.strokeStyle="rgba(62,242,255,.07)";g.lineWidth=Math.max(1,dpr*.8);g.beginPath();
  for(var row=-1;row*1.5*s<h+s;row++)for(var col=-1;col*hw<w+hw;col++){var cxp=col*hw+(row&1?hw/2:0),cyp=row*1.5*s;for(i=0;i<6;i++){var a=Math.PI/3*i+Math.PI/6,px=cxp+s*Math.cos(a),py=cyp+s*Math.sin(a);if(i===0)g.moveTo(px,py);else g.lineTo(px,py);}g.closePath();}
  g.stroke();
  for(i=0;i<Math.round(w*h/(9000*dpr*dpr));i++){var sz=(R0()*1.3+.3)*dpr;g.fillStyle="rgba("+(180+R0()*75|0)+","+(210+R0()*45|0)+",255,"+(.35+R0()*.6)+")";g.fillRect(R0()*w,R0()*h,sz,sz);}
  /* parallax synapse network strip */
  netImg=mk(w,h);var n=netImg.getContext("2d"),R1=rng(5),pts=[];for(i=0;i<Math.max(14,Math.round(w/(60*dpr)));i++)pts.push([R1()*w,h*(.08+R1()*.5),1+R1()*2]);
  n.strokeStyle="rgba(142,162,255,.14)";n.lineWidth=Math.max(1,dpr);
  pts.forEach(function(p,a){pts.forEach(function(q,b){if(b<=a)return;var dx=Math.min(Math.abs(p[0]-q[0]),w-Math.abs(p[0]-q[0]));if(dx<w*.16&&Math.abs(p[1]-q[1])<h*.18){n.beginPath();n.moveTo(p[0],p[1]);n.lineTo(q[0]+(Math.abs(p[0]-q[0])>w/2?(q[0]>p[0]?-w:w):0),q[1]);n.stroke();}});});
  pts.forEach(function(p){n.fillStyle="rgba(62,242,255,.5)";n.beginPath();n.arc(p[0],p[1],p[2]*dpr,0,7);n.fill();n.fillStyle="rgba(62,242,255,.08)";n.beginPath();n.arc(p[0],p[1],p[2]*5*dpr,0,7);n.fill();});
}
function buildSprites(){
  var s=Math.ceil(T*2.4);orbImg=mk(s,s);var g=orbImg.getContext("2d"),c=s/2,q=g.createRadialGradient(c,c,0,c,c,c);
  q.addColorStop(0,"rgba(255,255,255,1)");q.addColorStop(.14,"rgba(220,235,255,1)");q.addColorStop(.2,rgba(PERI,.95));q.addColorStop(.42,rgba(CYAN,.35));q.addColorStop(1,"rgba(62,242,255,0)");
  g.fillStyle=q;g.fillRect(0,0,s,s);
}
function layout(){
  dpr=Math.min(window.devicePixelRatio||1,2);var vw=innerWidth,vh=innerHeight;W=cv.width=Math.round(vw*dpr);H=cv.height=Math.round(vh*dpr);
  safeB=(parseFloat(getComputedStyle(probe).paddingBottom)||0)*dpr;
  T=Math.min(H/9,W/10.5);GY=H*(vh>vw?.64:.68);drawBg();buildSprites();
}
function SX(wx){return(wx-(x-(W/T)*.27))*T;}
function SY(wy){return GY-(wy-camY)*T;}

/* ---------- game ---------- */
function reset(){simT=0;x=0;y=R;vy=0;grounded=true;lastGround=0;pressT=-9;held=false;dead=false;won=false;endT=0;camY=0;trail=[];shards=[];pct=0;secIdx=-1;banner=null;flash=0;autoI=0;startGuard=.15;PortalKit.setScore(0);}
function sectionAt(beat){var k=-1;for(var i=0;i<SECTIONS.length;i++)if(beat>=SECTIONS[i].beat)k=i;return k;}
function die(){if(dead||won)return;dead=true;endT=0;flash=1;sfxCrash();newBus();
  for(var i=0;i<46;i++){var a=Math.random()*Math.PI*2,sp=3+Math.random()*9;shards.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+4,l:0,m:.6+Math.random()*.6,c:[CYAN,PERI,PINK,VIOLET][i%4]});}}
function finish(){if(won||dead)return;won=true;endT=0;flash=.8;pct=100;PortalKit.setScore(100);
  for(var i=0;i<60;i++){var a=Math.random()*Math.PI*2,sp=2+Math.random()*8;shards.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:0,m:.8+Math.random()*.8,c:[TEAL,PINK,VIOLET,LIME][i%4]});}}
function press(){if(!PortalKit.isPlaying()||startGuard>0)return;pressT=simT;}
function step(h){
  simT+=h;x+=SPEED*h;
  if(auto&&autoI<JUMPS.length&&x>=JUMPS[autoI]*TPB){pressT=simT;autoI++;}
  vy-=G*h;y+=vy*h;
  var sup=support(x,R*.6);
  if(y-R<=sup){if(y-R<sup-.3){die();return;}y=sup+R;if(vy<0)vy=0;grounded=true;lastGround=simT;}
  else if(y-R>sup+.001)grounded=false;
  if((simT-pressT<.12||held)&&(grounded||simT-lastGround<.08)&&vy<=0){vy=V0;grounded=false;lastGround=-9;pressT=-9;sfxJump();}
  if(y<-4){die();return;}
  for(var i=0;i<spikes.length;i++){var s=spikes[i];if(Math.abs(s.x-x)>1.2)continue;
    var nx=Math.max(s.x-.28,Math.min(x,s.x+.28)),ny=Math.max(s.b,Math.min(y,s.b+.5));if((x-nx)*(x-nx)+(y-ny)*(y-ny)<.0625){die();return;}}
  if(x>=GATEX)finish();
}
function update(dt){
  if(startGuard>0)startGuard-=dt;
  if(dead||won){endT+=dt;}
  else{
    var gdt=dt;
    if(AC&&bus&&AC.state==="running"){var drift=(AC.currentTime-audioBase)-simT;if(Math.abs(drift)<.25)gdt+=Math.max(-.004,Math.min(.004,drift*.1));}
    var n=Math.max(1,Math.ceil(gdt*240)),h=gdt/n;for(var i=0;i<n&&!dead&&!won;i++)step(h);
    pumpAudio();
    var np=Math.max(0,Math.min(99,Math.floor(x/GATEX*100)));if(np!==pct&&!won){pct=np;PortalKit.setScore(pct);}
    var beat=simT/B,si=sectionAt(beat);if(si!==secIdx){secIdx=si;if(si>=0)banner={t:0,s:SECTIONS[si],i:si};}
    trail.push([x,y]);if(trail.length>16)trail.shift();
  }
  if(banner){banner.t+=dt;if(banner.t>2)banner=null;}
  flash=Math.max(0,flash-dt*2.5);
  var target=grounded?y-R:Math.min(camY,y-R);camY+=(Math.max(0,target)-camY)*Math.min(1,dt*3);
  for(var j=shards.length-1;j>=0;j--){var p=shards[j];p.l+=dt;if(p.l>p.m){shards.splice(j,1);continue;}p.vy-=20*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  if(dead&&endT>.75){dead=false;endT=-99;var s=SECTIONS[Math.max(0,secIdx)];PortalKit.lose(pct,"Reached "+pct+"% in Section "+(Math.max(0,secIdx)+1)+" · "+s.name+".");}
  if(won&&endT>1){won=false;endT=-99;PortalKit.win(100,"You crossed the finish gate in time with the beat!");}
}
function render(){
  var beatF=simT/B,ph=beatF-Math.floor(beatF),pulse=simT>0?Math.exp(-ph*5):0,col=SECTIONS[Math.max(0,secIdx)].col;
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,W,H);
  /* parallax network */
  var off=((x*T*.18)%W+W)%W;cx.globalAlpha=.7+.3*pulse;cx.drawImage(netImg,-off,0);cx.drawImage(netImg,W-off,0);cx.globalAlpha=1;
  var vx0=x-(W/T)*.27-2,vx1=vx0+W/T+4,bottom=H+10;
  /* ground bodies */
  for(var i=0;i<solids.length;i++){var s=solids[i];if(s.x1<vx0||s.x0>vx1)continue;var a=SX(s.x0),b=SX(s.x1),t=SY(s.top);
    var gr=cx.createLinearGradient(0,t,0,t+T*3);gr.addColorStop(0,"rgba(30,44,120,.85)");gr.addColorStop(1,"rgba(8,14,46,.92)");cx.fillStyle=gr;cx.fillRect(a,t,b-a,bottom-t);
    cx.strokeStyle="rgba(62,242,255,.10)";cx.lineWidth=Math.max(1,dpr);cx.beginPath();for(var gx=Math.ceil(s.x0);gx<s.x1;gx++){var px=SX(gx);cx.moveTo(px,t+T*.3);cx.lineTo(px,Math.min(bottom,t+T*2.5));}cx.stroke();}
  /* neon pathway edges */
  cx.globalCompositeOperation="lighter";cx.lineJoin="round";
  [[T*.28,rgba(col,.12+.1*pulse)],[T*.1,rgba(col,.45)],[Math.max(1.5,T*.035),"rgba(235,250,255,.95)"]].forEach(function(L){cx.strokeStyle=L[1];cx.lineWidth=L[0];cx.beginPath();
    for(var i=0;i<solids.length;i++){var s=solids[i];if(s.x1<vx0||s.x0>vx1)continue;var a=SX(s.x0),b=SX(s.x1),t=SY(s.top);cx.moveTo(a,Math.min(bottom,t+T*2.2));cx.lineTo(a,t);cx.lineTo(b,t);cx.lineTo(b,Math.min(bottom,t+T*2.2));}cx.stroke();});
  /* synapse nodes pulse on the beat */
  for(var k=0;k<nodes.length;k++){var nd=nodes[k];if(nd.x<vx0||nd.x>vx1)continue;var nx=SX(nd.x),ny=SY(nd.y),rr0=T*(.07+.07*pulse);cx.fillStyle=rgba(col,.25*pulse+.08);cx.beginPath();cx.arc(nx,ny,rr0*3.5,0,7);cx.fill();cx.fillStyle="rgba(255,255,255,.9)";cx.beginPath();cx.arc(nx,ny,rr0,0,7);cx.fill();}
  cx.globalCompositeOperation="source-over";
  /* spikes */
  for(var j=0;j<spikes.length;j++){var sp=spikes[j];if(sp.x<vx0||sp.x>vx1)continue;var sx=SX(sp.x),sb=SY(sp.b),hw=T*.45,hh=T*.9;
    var g2=cx.createLinearGradient(0,sb-hh,0,sb);g2.addColorStop(0,"rgba(255,138,61,.95)");g2.addColorStop(1,"rgba(255,46,154,.55)");
    cx.beginPath();cx.moveTo(sx-hw,sb);cx.lineTo(sx,sb-hh);cx.lineTo(sx+hw,sb);cx.closePath();cx.fillStyle=g2;cx.fill();
    cx.globalCompositeOperation="lighter";cx.strokeStyle=rgba(PINK,.35);cx.lineWidth=T*.16;cx.stroke();cx.strokeStyle="rgba(255,220,235,.95)";cx.lineWidth=Math.max(1.2,T*.04);cx.stroke();cx.globalCompositeOperation="source-over";}
  drawGate(pulse);
  /* orb + trail */
  if(!dead&&endT>-99||won){cx.globalCompositeOperation="lighter";
    for(var q=0;q<trail.length;q++){var tp=trail[q],f=(q+1)/trail.length,ss=T*2.4*(.25+.5*f);cx.globalAlpha=f*.35;cx.drawImage(orbImg,SX(tp[0])-ss/2,SY(tp[1])-ss/2,ss,ss);}
    cx.globalAlpha=1;if(!won||endT<.15){var os=T*2.4*(1+.12*pulse);cx.drawImage(orbImg,SX(x)-os/2,SY(y)-os/2,os,os);}
    cx.globalCompositeOperation="source-over";
    var ang=x/R*.5;cx.strokeStyle="rgba(10,20,64,.55)";cx.lineWidth=Math.max(1,T*.04);cx.beginPath();cx.arc(SX(x),SY(y),T*R*.55,ang,ang+2.2);cx.stroke();}
  /* shards */
  cx.globalCompositeOperation="lighter";for(var m=0;m<shards.length;m++){var p=shards[m],al=1-p.l/p.m;cx.fillStyle=rgba(p.c,al);var px2=SX(p.x),py2=SY(p.y),z=T*.14;cx.beginPath();cx.moveTo(px2,py2-z);cx.lineTo(px2+z*.6,py2);cx.lineTo(px2,py2+z);cx.lineTo(px2-z*.6,py2);cx.fill();}
  cx.globalCompositeOperation="source-over";
  if(flash>0){cx.fillStyle=dead||endT>=0&&!won?"rgba(255,46,154,"+flash*.25+")":"rgba(62,242,255,"+flash*.25+")";cx.fillRect(0,0,W,H);}
  drawUI(col);
}
function drawGate(pulse){
  var gx=SX(GATEX),gy=SY(support(GATEX,.1)+2.1);if(gx<-T*4||gx>W+T*4)return;
  cx.save();cx.translate(gx,gy);cx.globalCompositeOperation="lighter";
  var rings=[[TEAL,1.0],[PINK,.78],[VIOLET,.56],[CYAN,.34]];
  rings.forEach(function(r,i){cx.save();cx.rotate(simT*(i%2?-.8:.6));cx.strokeStyle=rgba(r[0],.25);cx.lineWidth=T*.22;cx.beginPath();cx.ellipse(0,0,T*1.3*r[1],T*2.1*r[1],0,0,7);cx.stroke();
    cx.strokeStyle=rgba(r[0],.95);cx.lineWidth=Math.max(1.5,T*.05);cx.setLineDash([T*.6,T*.25]);cx.lineDashOffset=-simT*T*2;cx.beginPath();cx.ellipse(0,0,T*1.3*r[1],T*2.1*r[1],0,0,7);cx.stroke();cx.setLineDash([]);cx.restore();});
  var q=cx.createRadialGradient(0,0,0,0,0,T*1.4);q.addColorStop(0,"rgba(255,255,255,"+(.5+.3*pulse)+")");q.addColorStop(.4,"rgba(142,162,255,.25)");q.addColorStop(1,"rgba(0,0,0,0)");cx.fillStyle=q;cx.beginPath();cx.ellipse(0,0,T*1.2,T*2,0,0,7);cx.fill();
  cx.strokeStyle=rgba(ORANGE,.9);cx.lineWidth=Math.max(1,T*.04);
  for(var i=0;i<5;i++){var a=simT*1.2+i*Math.PI*2/5,px=Math.cos(a)*T*1.7,py=Math.sin(a)*T*2.5,z=T*.22;cx.save();cx.translate(px,py);cx.rotate(a*2);cx.beginPath();cx.moveTo(0,-z);cx.lineTo(z*.87,z*.5);cx.lineTo(-z*.87,z*.5);cx.closePath();cx.stroke();cx.restore();}
  cx.restore();
}
function drawUI(col){
  var u=dpr,bw=Math.min(W*.86,520*u),bh=10*u,bx=(W-bw)/2,by=H-safeB-30*u;
  rr(cx,bx-8*u,by-20*u,bw+16*u,bh+28*u,12*u);cx.fillStyle="rgba(10,20,64,.55)";cx.fill();cx.strokeStyle="rgba(62,242,255,.45)";cx.lineWidth=u;cx.stroke();
  rr(cx,bx,by,bw,bh,bh/2);cx.fillStyle="rgba(62,242,255,.08)";cx.fill();
  var f=Math.min(1,x/GATEX);if(f>0){var g=cx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,CYAN);g.addColorStop(.5,PINK);g.addColorStop(1,LIME);cx.fillStyle=g;rr(cx,bx,by,Math.max(bh,bw*f),bh,bh/2);cx.fill();}
  cx.strokeStyle=ORANGE;cx.lineWidth=1.5*u;SECTIONS.forEach(function(s){var sx=bx+bw*(s.beat*TPB/GATEX);cx.beginPath();cx.moveTo(sx,by-3*u);cx.lineTo(sx,by+bh+3*u);cx.stroke();});
  cx.font="600 "+(11*u)+"px Inter, sans-serif";cx.textBaseline="bottom";cx.fillStyle="rgba(234,246,255,.85)";cx.textAlign="left";
  cx.fillText(secIdx>=0?"Section "+(secIdx+1)+" · "+SECTIONS[secIdx].name:"Warm-up",bx,by-4*u);cx.textAlign="right";cx.fillText(Math.floor(f*100)+"%",bx+bw,by-4*u);
  if(banner){var a=banner.t<.3?banner.t/.3:banner.t>1.5?Math.max(0,(2-banner.t)/.5):1;cx.globalAlpha=a;cx.textAlign="center";cx.textBaseline="middle";
    cx.font="800 "+Math.round(Math.min(W*.06,30*u))+"px Orbitron, Inter, sans-serif";cx.shadowColor=PERI;cx.shadowBlur=18*u;cx.fillStyle="#fff";cx.fillText("SECTION "+(banner.i+1),W/2,H*.24);
    cx.font="600 "+Math.round(14*u)+"px Orbitron, Inter, sans-serif";cx.fillStyle=PERI;cx.fillText(banner.s.name.toUpperCase(),W/2,H*.24+26*u);cx.shadowBlur=0;cx.globalAlpha=1;}
  if(PortalKit.isPlaying()&&simT<3.5){cx.globalAlpha=Math.min(1,(3.5-simT));cx.textAlign="center";cx.textBaseline="middle";cx.font="600 "+(15*u)+"px Inter, sans-serif";cx.fillStyle="rgba(234,246,255,.9)";
    cx.fillText("Tap, click or press Space to jump · jump on the chime",W/2,GY+T*1.4);cx.globalAlpha=1;}
}
var last=performance.now();
function frame(now){var dt=Math.min(.1,(now-last)/1000);last=now;if(PortalKit.isPlaying())update(dt);render();requestAnimationFrame(frame);}

/* ---------- input ---------- */
PortalKit.onTap(cv,function(){if(startGuard>0)return;held=true;press();});

});
