<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Crystal Guard · Portal World</title>
<!-- Crystal Guard (Imagination Station), portal 3 / teal. Single file, everything procedural, no external assets beyond the shared kit. -->
<style>
html,body{margin:0;height:100%;background:linear-gradient(#0A1440,#050A24);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;color:#EAF6FF;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
canvas#game{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:7000;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"stats towers ctrl";gap:8px;align-items:center;padding:8px 10px;border-radius:18px;
  background:linear-gradient(160deg,rgba(25,227,209,.12),rgba(10,20,64,.55) 60%,rgba(25,227,209,.06));border:1px solid rgba(25,227,209,.5);box-shadow:0 0 22px rgba(25,227,209,.2),inset 0 0 26px rgba(25,227,209,.07);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bar.off,#pop.off{display:none}
.stats{grid-area:stats;display:flex;gap:6px}
.st{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:11px;background:rgba(10,20,64,.55);border:1px solid rgba(25,227,209,.3);font-size:13px;font-weight:600;white-space:nowrap}
.st b{font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.st i{font-style:normal;color:#19E3D1}
.st.hit{animation:hit .5s}
@keyframes hit{30%{background:rgba(255,255,255,.35);transform:scale(1.08)}}
.towers{grid-area:towers;display:flex;gap:6px;justify-content:center}
.tb{flex:1;max-width:170px;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:44px;border-radius:13px;border:1.5px solid rgba(234,246,255,.25);background:rgba(10,20,64,.5);color:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;text-align:left;touch-action:manipulation;transition:box-shadow .15s,border-color .15s,transform .1s}
.tb:active{transform:scale(.97)}
.tb canvas{width:30px;height:34px;flex:none}
.tb .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .cs{display:block;color:#A8FFF6;font-weight:800;font-size:12px}
.tb .k{margin-left:auto;opacity:.45;font-size:11px;border:1px solid rgba(234,246,255,.35);border-radius:5px;padding:0 4px}
.tb.sel{border-color:var(--c);box-shadow:0 0 16px var(--c),inset 0 0 12px rgba(255,255,255,.08)}
.tb.poor{opacity:.45}
.ctrl{grid-area:ctrl;display:flex;gap:6px}
.cb{min-width:44px;min-height:44px;padding:0 12px;border-radius:13px;border:1.5px solid rgba(25,227,209,.55);background:rgba(25,227,209,.08);color:#fff;font:700 13px Inter,system-ui,sans-serif;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.cb:disabled{opacity:.45;cursor:default}
.cb.go{border-color:#19E3D1;background:rgba(25,227,209,.18);box-shadow:0 0 14px rgba(25,227,209,.45)}
.cb.go:disabled{box-shadow:none}
#pop{position:fixed;z-index:7500;min-width:170px;padding:10px 12px;border-radius:16px;text-align:center;transform:translate(-50%,-100%);
  background:linear-gradient(160deg,rgba(10,20,64,.9),rgba(8,40,60,.9));border:1px solid var(--c,#19E3D1);box-shadow:0 0 18px rgba(25,227,209,.3)}
#pop h3{margin:0 0 2px;font:800 14px Orbitron,Inter,sans-serif;letter-spacing:.04em}
#pop p{margin:0 0 8px;font-size:12px;opacity:.75}
#pop .row{display:flex;gap:6px;justify-content:center}
#pop .cb{flex:1;min-height:44px;font-size:12px}
@media (max-width:900px){
  #bar{grid-template-columns:1fr auto;grid-template-areas:"stats ctrl" "towers towers";padding:7px}
  .st{padding:5px 7px;font-size:12px}
  .tb{padding:5px 6px;gap:5px;font-size:12px}.tb .k{display:none}.tb canvas{width:24px;height:28px}
}
</style>
</head><body>
<canvas id="game"></canvas>
<div id="bar" class="off">
  <div class="stats"><span class="st" id="stLives" title="Lives">&#x2665;<b id="lives">20</b></span><span class="st" title="Crystals"><i>&#x25C6;</i><b id="gems">0</b></span><span class="st" title="Wave">Wave<b id="wave">0/10</b></span></div>
  <div class="towers" id="towers"></div>
  <div class="ctrl"><button class="cb" id="speed" title="Game speed (F)">1&times;</button><button class="cb" id="mute" title="Sound (M)" aria-label="Sound">&#x266A;</button><button class="cb go" id="next" title="Next wave (N)">Start &#x25B6;</button></div>
</div>
<div id="pop" class="off"><h3 id="popName"></h3><p id="popInfo"></p><div class="row"><button class="cb go" id="popUp"></button><button class="cb" id="popSell"></button></div></div>
<script src="../../03-world/kit/portal-kit.js"></script>
<script>
"use strict";
/* ================= data ================= */
const COLS = 13, ROWS = 8; let TILT = 0.78; const MAX_WAVE = 10, START_GEMS = 130, START_LIVES = 20;
const WAYPOINTS = [[0,1],[3,1],[3,6],[6,6],[6,1],[9,1],[9,6],[11,6],[11,3],[12,3]];
const TT = {
  pulse: { key: "1", name: "Pulse Crystal", color: "#19E3D1", cost: 50, up: 70, blurb: "Fast single-target bolts",
    lv: [{ range: 2.6, dmg: 12, rate: 0.55 }, { range: 3.0, dmg: 26, rate: 0.42 }] },
  frost: { key: "2", name: "Frost Prism", color: "#A8FFF6", cost: 60, up: 65, blurb: "Slows what it hits",
    lv: [{ range: 2.3, dmg: 5, rate: 0.8, slow: 0.45, slowT: 1.6, splash: 0 }, { range: 2.7, dmg: 10, rate: 0.65, slow: 0.6, slowT: 2.0, splash: 1.0 }] },
  nova:  { key: "3", name: "Nova Bloom", color: "#5FF5E3", cost: 90, up: 110, blurb: "Splash damage bursts",
    lv: [{ range: 2.4, dmg: 22, rate: 1.6, splash: 1.1 }, { range: 2.8, dmg: 44, rate: 1.3, splash: 1.45 }] },
};
const ET = {
  wisp:  { hp: 34,   spd: 1.5,  reward: 4,   r: 0.22, color: "#3EF2FF", lives: 1,  pts: 10 },
  dart:  { hp: 22,   spd: 2.6,  reward: 4,   r: 0.18, color: "#7CFF6B", lives: 1,  pts: 12 },
  golem: { hp: 170,  spd: 0.9,  reward: 9,  r: 0.32, color: "#8B5CF6", lives: 2,  pts: 30 },
  boss:  { hp: 3600, spd: 0.55, reward: 120, r: 0.5,  color: "#FF8A3D", lives: 10, pts: 500, boss: true },
};
const WAVES = [
  [["wisp", 8, 1.0]],
  [["wisp", 12, 0.8]],
  [["wisp", 8, 0.8], ["dart", 6, 0.6]],
  [["dart", 10, 0.5], ["golem", 3, 1.8]],
  [["wisp", 14, 0.6], ["golem", 4, 1.5]],
  [["dart", 18, 0.4], ["golem", 3, 1.4]],
  [["golem", 7, 1.2], ["wisp", 14, 0.5]],
  [["dart", 16, 0.4], ["golem", 7, 1.1]],
  [["wisp", 18, 0.4], ["golem", 9, 1.0], ["dart", 14, 0.35]],
  [["wisp", 12, 0.5], ["golem", 6, 1.0], ["boss", 1, 1], ["dart", 10, 0.4]],
];
const hpMul = w => 1 + 0.3 * (w - 1) + 0.03 * (w - 1) * (w - 1);

/* ================= path ================= */
const PTS = WAYPOINTS.map(([x, y]) => ({ x: x + 0.5, y: y + 0.5 }));
const SEG = []; let PATH_LEN = 0;
for (let i = 0; i < PTS.length - 1; i++) { const a = PTS[i], b = PTS[i + 1], l = Math.hypot(b.x - a.x, b.y - a.y); SEG.push({ a, b, l, s: PATH_LEN }); PATH_LEN += l; }
const PATH_CELLS = new Set();
for (let i = 0; i < WAYPOINTS.length - 1; i++) { let [x, y] = WAYPOINTS[i]; const [x2, y2] = WAYPOINTS[i + 1];
  const dx = Math.sign(x2 - x), dy = Math.sign(y2 - y); PATH_CELLS.add(x + "," + y); while (x !== x2 || y !== y2) { x += dx; y += dy; PATH_CELLS.add(x + "," + y); } }
function posAt(d) { d = Math.max(0, Math.min(PATH_LEN, d)); for (const s of SEG) if (d <= s.s + s.l) { const t = (d - s.s) / s.l; return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t }; } return { ...PTS[PTS.length - 1] }; }
const HEART = PTS[PTS.length - 1], SPAWN = PTS[0];
const buildable = (i, j) => i >= 0 && j >= 0 && i < COLS && j < ROWS && !PATH_CELLS.has(i + "," + j);

/* ================= state ================= */
let S = null;
function reset() {
  S = { gems: START_GEMS, lives: START_LIVES, wave: 0, waveActive: false, countdown: -1, queue: [], qt: 0,
    towers: [], enemies: [], shots: [], parts: [], rings: [], floats: [], banner: null, shake: 0, heartHit: 0,
    build: null, sel: null, hover: null, speed: S ? S.speed : 1, time: 0, kills: 0, eid: 0, boss: null };
  closePop(); refreshUI();
}

/* ================= layout + projection ================= */
const cv = document.getElementById("game"), cx = cv.getContext("2d");
let W, H, DPR, C, ox, oy, portrait, ground = null;
function layout() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const bar = document.getElementById("bar"); const barH = bar.classList.contains("off") ? 120 : bar.getBoundingClientRect().height + 16;
  const top = 66, aw = W - 16, ah = H - top - barH - 8;
  portrait = ah > aw * 1.1; TILT = portrait ? 1 : 0.78; // top-down on phones so tiles stay >= 44px
  const mc = portrait ? ROWS : COLS, mr = portrait ? COLS : ROWS;
  C = Math.min(aw / mc, ah / (mr * TILT + 0.7));
  ox = (W - mc * C) / 2; oy = top + 0.7 * C + (ah - (mr * TILT + 0.7) * C) / 2;
  ground = null;
}
function P(gx, gy, h = 0) { const sx = portrait ? gy : gx, sy = portrait ? gx : gy; return [ox + sx * C, oy + sy * C * TILT - h * C]; }
function inv(X, Y) { const sx = (X - ox) / C, sy = (Y - oy) / (C * TILT); return portrait ? [sy, sx] : [sx, sy]; }

/* ================= sprites ================= */
const glowCache = {};
function glow(color) { if (glowCache[color]) return glowCache[color]; const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, color); r.addColorStop(0.35, color + "88"); r.addColorStop(1, color + "00"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return glowCache[color] = c; }
function drawGlow(x, y, rad, color, a = 1) { cx.globalAlpha = a; cx.drawImage(glow(color), x - rad, y - rad, rad * 2, rad * 2); cx.globalAlpha = 1; }
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function buildGround() {
  const g = document.createElement("canvas"); g.width = cv.width; g.height = cv.height; const c = g.getContext("2d"); c.scale(DPR, DPR);
  const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#0A1440"); bg.addColorStop(1, "#050A24"); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  const r = rnd(42);
  for (let i = 0; i < 160; i++) { c.fillStyle = `rgba(${r() > .5 ? "120,200,255" : "200,220,255"},${0.2 + r() * 0.6})`; const s = r() * 1.6; c.fillRect(r() * W, r() * H, s, s); }
  c.strokeStyle = "rgba(25,227,209,.05)"; c.lineWidth = 1; const hs = 26; // faint hex grid
  for (let y = -hs, row = 0; y < H + hs; y += hs * 0.866, row++) for (let x = (row % 2) * hs * 0.75 - hs; x < W + hs; x += hs * 1.5) {
    c.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; c.lineTo(x + Math.cos(a) * hs / 2, y + Math.sin(a) * hs / 2); } c.closePath(); c.stroke(); }
  // field plate
  const [ax, ay] = P(0, 0), [bx, by] = P(COLS, ROWS), x0 = Math.min(ax, bx), y0 = Math.min(ay, by), x1 = Math.max(ax, bx), y1 = Math.max(ay, by);
  c.shadowColor = "rgba(25,227,209,.5)"; c.shadowBlur = 24; c.fillStyle = "#0c1a4a"; roundRect(c, x0 - 6, y0 - 6, x1 - x0 + 12, y1 - y0 + 12, 14); c.fill(); c.shadowBlur = 0;
  c.strokeStyle = "rgba(25,227,209,.55)"; c.lineWidth = 1.5; c.stroke();
  // depth edge (pseudo-3D slab)
  c.fillStyle = "rgba(20,10,60,.9)"; c.fillRect(x0 - 6, y1 + 6, x1 - x0 + 12, C * 0.22);
  c.fillStyle = "rgba(168,255,246,.55)"; c.fillRect(x0 + 10, y1 + 6 + C * 0.22 - 2, Math.min(80, (x1 - x0) * 0.2), 2);
  for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) {
    const [px, py] = P(i, j), [qx, qy] = P(i + 1, j + 1), tx = Math.min(px, qx), ty = Math.min(py, qy), tw = Math.abs(qx - px), th = Math.abs(qy - py);
    if (PATH_CELLS.has(i + "," + j)) continue;
    const gr = c.createLinearGradient(tx, ty, tx, ty + th); const alt = (i + j) % 2;
    gr.addColorStop(0, alt ? "#13306a" : "#112a60"); gr.addColorStop(1, alt ? "#0f2456" : "#0d214f"); c.fillStyle = gr; c.fillRect(tx + 1, ty + 1, tw - 2, th - 2);
    c.strokeStyle = "rgba(25,227,209,.10)"; c.strokeRect(tx + 1.5, ty + 1.5, tw - 3, th - 3);
    for (let k = 0; k < 4; k++) { // glowing meadow grass and tiny crystal flowers
      const gx = tx + r() * tw, gy = ty + r() * th, col = ["#19E3D1", "#A8FFF6", "#0FB5A6", "#5FF5E3"][Math.floor(r() * 4)];
      c.strokeStyle = col + "66"; c.lineWidth = 1; c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx + (r() - .5) * 3, gy - 3 - r() * 5); c.stroke();
      if (r() < 0.25) { c.fillStyle = col; c.globalAlpha = 0.8; c.beginPath(); c.arc(gx, gy - 6, 1.4, 0, 7); c.fill(); c.globalAlpha = 1; }
    }
  }
  // path: glowing rift
  const line = (w, s) => { c.lineWidth = w; c.strokeStyle = s; c.lineJoin = "round"; c.lineCap = "round"; c.beginPath(); PTS.forEach((p, i) => { const [x, y] = P(p.x, p.y); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); };
  line(C * 0.9, "rgba(25,227,209,.25)"); line(C * 0.8, "#081a3a"); line(C * 0.62, "#0b2246"); line(C * 0.06, "rgba(25,227,209,.55)");
  ground = g;
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ================= sound (tiny synth, off until first tap) ================= */
let AC = null, muted = false, lastShot = 0;
function sfx(type) {
  if (muted) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  if (AC.state === "suspended") AC.resume();
  const now = AC.currentTime; if (type === "shoot") { if (now - lastShot < 0.07) return; lastShot = now; }
  const P = { shoot: [880, 1320, 0.05, "triangle", 0.03], frost: [1400, 700, 0.08, "sine", 0.035], nova: [220, 90, 0.25, "sawtooth", 0.05],
    kill: [660, 1500, 0.12, "triangle", 0.06], place: [300, 900, 0.18, "sine", 0.1], upgrade: [400, 1600, 0.3, "triangle", 0.09],
    sell: [900, 300, 0.18, "sine", 0.07], error: [160, 120, 0.15, "square", 0.05], leak: [200, 60, 0.35, "sawtooth", 0.1],
    wave: [440, 880, 0.35, "triangle", 0.07], boss: [90, 60, 0.9, "sawtooth", 0.12], win: [523, 1046, 0.6, "triangle", 0.1] }[type];
  if (!P) return; const o = AC.createOscillator(), g = AC.createGain(); o.type = P[3]; o.frequency.setValueAtTime(P[0], now); o.frequency.exponentialRampToValueAtTime(P[1], now + P[2]);
  g.gain.setValueAtTime(P[4], now); g.gain.exponentialRampToValueAtTime(0.0001, now + P[2] + 0.05); o.connect(g).connect(AC.destination); o.start(now); o.stop(now + P[2] + 0.06);
}

/* ================= effects ================= */
function burst(x, y, color, n = 12, spd = 2.5, h = 0.3) { for (let i = 0; i < n && S.parts.length < 500; i++) { const a = Math.random() * 6.283, s = spd * (0.4 + Math.random());
  S.parts.push({ x, y, h, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vh: 1 + Math.random() * 2.5, life: 0.5 + Math.random() * 0.4, max: 0.9, color, size: 2 + Math.random() * 2.5 }); } }
function ring(x, y, color, r1 = 1.2, life = 0.45) { S.rings.push({ x, y, r1, life, max: life, color }); }
function floater(x, y, text, color, size = 13, h = 0.6) { if (S.floats.length > 70) S.floats.shift(); S.floats.push({ x, y, h, text, color, size, life: 0.9, max: 0.9 }); }
function banner(text, sub, color = "#19E3D1") { S.banner = { text, sub, color, life: 2.2, max: 2.2 }; }

/* ================= game logic ================= */
function towerAt(i, j) { return S.towers.find(t => t.i === i && t.j === j); }
function place(type, i, j) {
  const T = TT[type]; if (!T) return false;
  if (!buildable(i, j)) { floater(i + .5, j + .5, "Can't build on the path", "#A8FFF6", 12); sfx("error"); return false; }
  if (towerAt(i, j)) return false;
  if (S.gems < T.cost) { floater(i + .5, j + .5, "Need " + T.cost + " \u25C6", "#A8FFF6", 12); sfx("error"); flashStat("gems"); return false; }
  S.gems -= T.cost; const t = { type, i, j, x: i + .5, y: j + .5, lv: 0, cd: 0.2, spent: T.cost, pop: 1, kick: 0, ang: 0 };
  S.towers.push(t); ring(t.x, t.y, T.color, 1.1, 0.5); burst(t.x, t.y, T.color, 16, 2.2, 0.1); floater(t.x, t.y, "-" + T.cost + " \u25C6", "#A8FFF6", 12, 1.2); sfx("place");
  refreshUI(); return t;
}
function upgrade(t) {
  const T = TT[t.type]; if (!t || t.lv >= 1) return false;
  if (S.gems < T.up) { floater(t.x, t.y, "Need " + T.up + " \u25C6", "#A8FFF6", 12, 1.2); sfx("error"); flashStat("gems"); return false; }
  S.gems -= T.up; t.spent += T.up; t.lv = 1; t.pop = 1.2; ring(t.x, t.y, "#A8FFF6", 1.4, 0.6); ring(t.x, t.y, T.color, 1.8, 0.8); burst(t.x, t.y, T.color, 26, 3, 0.8);
  floater(t.x, t.y, "UPGRADED", "#E6FFFB", 14, 1.4); sfx("upgrade"); refreshUI(); return true;
}
function sell(t) { const refund = Math.floor(t.spent * 0.7); S.gems += refund; S.towers = S.towers.filter(o => o !== t); burst(t.x, t.y, "#E6FFFB", 14, 2, 0.4);
  floater(t.x, t.y, "+" + refund + " \u25C6", "#E6FFFB", 14, 1); sfx("sell"); closePop(); refreshUI(); }
function startWave() {
  if (S.waveActive || S.wave >= MAX_WAVE) return;
  if (S.countdown > 0) { const bonus = Math.floor(S.countdown); if (bonus > 0) { S.gems += bonus; floater(HEART.x, HEART.y, "+" + bonus + " \u25C6 early", "#E6FFFB", 13, 1.2); } }
  S.wave++; S.waveActive = true; S.countdown = -1; S.queue = []; let t = 0.4;
  for (const [type, n, gap] of WAVES[S.wave - 1]) { for (let k = 0; k < n; k++) { S.queue.push({ t, type }); t += gap; } t += 1.6; }
  S.qt = 0; const isBoss = S.wave === MAX_WAVE;
  banner("Wave " + S.wave, isBoss ? "Final wave: a Shard Titan is coming" : (S.wave === 1 ? "Defend the Heart Crystal" : WAVES[S.wave - 1].map(g => g[1] + " " + g[0] + (g[1] > 1 ? "s" : "")).join(" · ")), isBoss ? "#A8FFF6" : "#19E3D1");
  sfx("wave"); refreshUI();
}
function spawn(type) {
  const E = ET[type], m = E.boss ? 1 : hpMul(S.wave), hp = Math.round(E.hp * m);
  const e = { id: ++S.eid, type, hp, max: hp, d: 0, x: SPAWN.x, y: SPAWN.y, slowT: 0, slow: 0, flash: 0, wob: Math.random() * 6 };
  S.enemies.push(e); ring(SPAWN.x, SPAWN.y, E.color, 0.8, 0.4);
  if (E.boss) { S.boss = e; banner("MINI-BOSS", "Shard Titan · slow-resistant", "#A8FFF6"); S.shake = 0.5; sfx("boss"); }
}
function damage(e, dmg, color) {
  if (e.hp <= 0) return; e.hp -= dmg; e.flash = 0.1;
  if (dmg >= 8 || ET[e.type].boss) floater(e.x + (Math.random() - .5) * .3, e.y, String(Math.round(dmg)), "#ffffff", dmg >= 30 ? 15 : 12, 0.7);

    if (hp < 0.4) { cx.moveTo(x + s * 0.15, y - s * 0.6); cx.lineTo(x + s * 0.02, y - s * 0.3); } cx.stroke(); }
}

/* ================= UI ================= */
const $ = id => document.getElementById(id), bar = $("bar"), pop = $("pop");
const towerBtns = {};
Object.entries(TT).forEach(([k, T]) => {
  const b = document.createElement("button"); b.className = "tb"; b.style.setProperty("--c", T.color); b.title = T.name + " (" + T.key + "): " + T.blurb;
  const ic = document.createElement("canvas"); ic.width = 60; ic.height = 68; const g = ic.getContext("2d"); drawTowerArt(g, k, 0, 30, 60, 64, 0);
  b.append(ic); b.insertAdjacentHTML("beforeend", `<span style="min-width:0"><span class="nm">${T.name}</span><span class="cs">\u25C6 ${T.cost}</span></span><span class="k">${T.key}</span>`);
  b.onclick = () => { selectBuild(S.build === k ? null : k); }; $("towers").append(b); towerBtns[k] = b;
});
function selectBuild(k) { if (!PortalKit.isPlaying()) return; S.build = k; closePop(); refreshUI(); }
function flashStat(which) { const el = which === "lives" ? $("stLives") : $("gems").parentNode; el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }
function refreshUI() {
  if (!S) return; $("lives").textContent = S.lives; $("gems").textContent = S.gems; $("wave").textContent = S.wave + "/" + MAX_WAVE;
  for (const [k, b] of Object.entries(towerBtns)) { b.classList.toggle("sel", S.build === k); b.classList.toggle("poor", S.gems < TT[k].cost); }
  const nb = $("next");
  if (S.waveActive) { nb.disabled = true; nb.textContent = "Wave " + S.wave; }
  else if (S.wave >= MAX_WAVE) { nb.disabled = true; nb.textContent = "Done"; }
  else { nb.disabled = false; nb.textContent = S.wave === 0 ? "Start \u25B6" : (S.countdown > 0 ? "Next " + Math.ceil(S.countdown) + "s \u25B6" : "Next \u25B6"); }
  $("speed").innerHTML = S.speed + "&times;";
  if (S.sel) fillPop();
}
function openPop(t) { S.sel = t; S.build = null; fillPop(); pop.classList.remove("off"); positionPop(); refreshUI(); }
function closePop() { if (S) S.sel = null; pop.classList.add("off"); }
function fillPop() { const t = S.sel, T = TT[t.type]; pop.style.setProperty("--c", T.color);
  $("popName").textContent = T.name; $("popInfo").textContent = "Level " + (t.lv + 1) + "/2 · " + T.blurb;
  const up = $("popUp"); if (t.lv >= 1) { up.disabled = true; up.textContent = "Max level"; } else { up.disabled = S.gems < T.up; up.textContent = "Upgrade \u25C6" + T.up + " (U)"; }
  $("popSell").textContent = "Sell +" + Math.floor(t.spent * 0.7) + " (S)"; }
function positionPop() { const [x, y] = P(S.sel.x, S.sel.y, 1.05), [, gy] = P(S.sel.x, S.sel.y), r = pop.getBoundingClientRect(), hw = r.width / 2, below = y - r.height < 70;
  pop.style.transform = below ? "translate(-50%,0)" : "translate(-50%,-100%)"; pop.style.left = Math.max(hw + 6, Math.min(W - hw - 6, x)) + "px"; pop.style.top = (below ? gy + C * 0.35 : y) + "px"; }
$("popUp").onclick = () => { if (S.sel && PortalKit.isPlaying()) upgrade(S.sel); };
$("popSell").onclick = () => { if (S.sel && PortalKit.isPlaying()) sell(S.sel); };
$("next").onclick = () => { if (PortalKit.isPlaying()) startWave(); };
$("speed").onclick = () => { S.speed = S.speed === 1 ? 2 : 1; refreshUI(); };
$("mute").onclick = () => { muted = !muted; $("mute").style.opacity = muted ? 0.45 : 1; };

PortalKit.onTap(cv, (x, y) => {
  const [gx, gy] = inv(x, y), i = Math.floor(gx), j = Math.floor(gy);
  if (i < 0 || j < 0 || i >= COLS || j >= ROWS) { closePop(); S.build = null; refreshUI(); return; }
  const tw = towerAt(i, j);
  if (tw) { openPop(tw); return; }
  if (S.sel) { closePop(); refreshUI(); if (!S.build) return; }
  if (S.build) { place(S.build, i, j); return; }
  if (buildable(i, j)) floater(i + .5, j + .5, "Pick a tower below", "#EAF6FF", 12);
});
cv.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; const [gx, gy] = inv(e.clientX, e.clientY); S.hover = { i: Math.floor(gx), j: Math.floor(gy) }; });
cv.addEventListener("pointerleave", () => { S.hover = null; });
cv.addEventListener("contextmenu", e => { e.preventDefault(); S.build = null; closePop(); refreshUI(); });
addEventListener("keydown", e => {
  if (!PortalKit.isPlaying() || e.repeat) return; const k = e.key.toLowerCase();
  const byKey = Object.keys(TT).find(t => TT[t].key === k); if (byKey) { selectBuild(S.build === byKey ? null : byKey); return; }
  if (k === "n") startWave(); else if (k === "f") $("speed").click(); else if (k === "m") $("mute").click();
  else if (k === "u" && S.sel) upgrade(S.sel); else if ((k === "s" || k === "delete" || k === "backspace") && S.sel) sell(S.sel);
  else if (k === "x") { S.build = null; closePop(); refreshUI(); }
});
addEventListener("resize", () => { layout(); });

/* ================= kit + loop ================= */
PortalKit.init({
  id: "crystal-guard", title: "Crystal Guard", color: "teal",
  goal: "Guard the Heart Crystal through 10 waves, mini-boss included.",
  howTo: ["Pick a tower below (or press 1, 2, 3), then tap a meadow tile to build it",
    "Pulse Crystal hits one target fast, Frost Prism slows, Nova Bloom bursts for splash damage",
    "Tap a tower to upgrade or sell it (U / S). Kills earn \u25C6 crystals",
    "Start each wave yourself for bonus \u25C6, toggle 2\u00D7 speed with F",
    "Every enemy that reaches the Heart costs lives. Lose all 20 and it shatters"],
  onStart() { reset(); bar.classList.remove("off"); layout(); },
  onPause() { closePop(); },
  onWin() { bar.classList.add("off"); closePop(); },
  onLose() { bar.classList.add("off"); closePop(); },
});
reset(); layout();
let last = performance.now(), uiT = 0;
function frame(now) {
  const real = Math.min((now - last) / 1000, 0.1); last = now;
  if (PortalKit.isPlaying()) { let left = real * S.speed; while (left > 0) { const d = Math.min(left, 1 / 60); step(d); left -= d; if (!PortalKit.isPlaying()) break; }
    uiT += real; if (uiT > 0.25) { uiT = 0; refreshUI(); } }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* test hook for automated QA (read-only state + the same actions the UI performs) */
window.__crystalGuard = { get state() { return S; }, place: (k, i, j) => place(k, i, j), upgrade: (i, j) => upgrade(towerAt(i, j)), sell: (i, j) => { const t = towerAt(i, j); if (t) sell(t); },
  nextWave: () => startWave(), setSpeed: n => { S.speed = n; }, toScreen: (gx, gy) => P(gx, gy) };
</script>
