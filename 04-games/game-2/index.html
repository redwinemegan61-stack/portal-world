<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Potion Sort · Portal World</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050A24;color:#EAF6FF;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#stage{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 10px 90px;box-sizing:border-box}
#level{font-family:Orbitron,Inter,sans-serif;font-weight:800;letter-spacing:.12em;font-size:14px;color:#3EF2FF;text-shadow:0 0 10px #3EF2FF;margin-bottom:18px}
#shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,3vw,22px);max-width:640px}
.tube{position:relative;width:clamp(44px,11vw,58px);height:clamp(150px,36vw,210px);cursor:pointer;transition:transform .22s cubic-bezier(.3,1.6,.5,1);touch-action:manipulation}
.tube .glass{contain:paint;position:absolute;inset:0;border-radius:6px 6px 30px 30px;border:2px solid rgba(200,240,255,.55);border-top:none;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 40%,rgba(255,255,255,.12));box-shadow:0 0 14px rgba(62,242,255,.25),inset 0 0 10px rgba(62,242,255,.12);overflow:hidden;display:flex;flex-direction:column-reverse;padding:0 3px 4px;box-sizing:border-box}
.tube .rim{position:absolute;top:-5px;left:-6px;right:-6px;height:8px;border-radius:6px;background:linear-gradient(#e6ecf5,#8a909a);box-shadow:0 0 8px rgba(62,242,255,.4)}
.seg{height:calc((100% - 16px)/4);flex:none;border-radius:2px;position:relative;transition:height .25s}
.seg:first-child{border-radius:2px 2px 22px 22px}
.seg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.28),transparent 35%,transparent 70%,rgba(0,0,0,.18))}
.seg.top:before{content:"";position:absolute;left:0;right:0;top:-3px;height:6px;border-radius:50%;background:inherit;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tube.sel{transform:translateY(-22px)}
.tube.sel .glass{border-color:#3EF2FF;box-shadow:0 0 22px #3EF2FF,inset 0 0 12px rgba(62,242,255,.25)}
.tube.done .glass{border-color:#FFC857;box-shadow:0 0 22px #FFC857}
.tube.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#tools{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;z-index:2;display:flex;justify-content:center;gap:12px}
.tool{min-height:44px;padding:11px 20px;border-radius:999px;border:1.5px solid #FF8A3D;background:rgba(10,20,64,.6);color:#fff;font:700 14px Inter,sans-serif;cursor:pointer;box-shadow:0 0 12px rgba(255,138,61,.3);touch-action:manipulation}
.tool:disabled{opacity:.35;cursor:default}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);z-index:3;padding:10px 18px;border-radius:14px;background:rgba(10,20,64,.85);border:1px solid #3EF2FF;opacity:0;transition:.25s;pointer-events:none;font-weight:600;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;z-index:2;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"><div id="level"></div><div id="shelf"></div></div>
<div id="tools"><button class="tool" id="undo">Undo <span id="undoN"></span></button><button class="tool" id="reset">Reset level</button></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script src="../../03-world/kit/portal-kit.js"></script>
<script>
(function(){
"use strict";
var CAP=4,LEVELS=10,UNDOS=5;
var POTIONS=["#FF2E9A","#3EF2FF","#8B5CF6","#FFC857","#7CFF6B","#FF8A3D","#8EA2FF","#E6ECF5","#19E3D1"];
var COLORS_PER_LEVEL=[3,4,4,5,5,6,6,7,7,8];
var tubes=[],start=[],history=[],sel=-1,level=0,undos=UNDOS,busy=false;
var shelf=document.getElementById("shelf"),lvl=document.getElementById("level");
var undoBtn=document.getElementById("undo"),undoN=document.getElementById("undoN");

function key(t){return t.map(function(x){return x.join("");}).sort().join("|");}
function canPour(t,a,b){if(a===b)return false;var A=t[a],B=t[b];if(!A.length||B.length>=CAP)return false;if(B.length&&B[B.length-1]!==A[A.length-1])return false;
  if(!B.length&&A.every(function(c){return c===A[0];}))return false; /* pointless: moving a pure tube into an empty one */
  return true;}
function pour(t,a,b){var A=t[a],B=t[b],c=A[A.length-1],n=0;while(A.length&&A[A.length-1]===c&&B.length<CAP){B.push(A.pop());n++;}return n;}
function solved(t){return t.every(function(x){return !x.length||(x.length===CAP&&x.every(function(c){return c===x[0];}));});}
function clone(t){return t.map(function(x){return x.slice();});}
function anyMove(t){for(var a=0;a<t.length;a++)for(var b=0;b<t.length;b++)if(canPour(t,a,b))return true;return false;}
function solvable(t){var seen={},nodes=0;
  function dfs(s){if(solved(s))return true;if(++nodes>60000)return null;var k=key(s);if(seen[k])return false;seen[k]=1;
    for(var a=0;a<s.length;a++)for(var b=0;b<s.length;b++)if(canPour(s,a,b)){var n=clone(s);pour(n,a,b);var r=dfs(n);if(r!==false)return r;}
    return false;}
  return dfs(clone(t))===true;}
function generate(nc){for(var tries=0;tries<200;tries++){var bag=[];for(var c=0;c<nc;c++)for(var i=0;i<CAP;i++)bag.push(c);
    for(var j=bag.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var tmp=bag[j];bag[j]=bag[r];bag[r]=tmp;}
    var t=[];for(var k=0;k<nc;k++)t.push(bag.slice(k*CAP,k*CAP+CAP));t.push([]);t.push([]);
    if(t.some(function(x){return x.length===CAP&&x.every(function(c){return c===x[0];});}))continue;
    if(solvable(t))return t;}
  return t;}

function render(){shelf.innerHTML="";tubes.forEach(function(t,i){var d=document.createElement("div");d.className="tube"+(i===sel?" sel":"")+(t.length===CAP&&t.every(function(c){return c===t[0];})?" done":"");
    d.innerHTML='<div class="rim"></div>';var g=document.createElement("div");g.className="glass";
    t.forEach(function(c,j){var s=document.createElement("div");s.className="seg"+(j===t.length-1?" top":"");s.style.background=POTIONS[c];g.appendChild(s);});
    d.appendChild(g);d.addEventListener("pointerdown",function(e){e.preventDefault();tap(i,d);});shelf.appendChild(d);});
  lvl.textContent="LEVEL "+(level+1)+" / "+LEVELS;undoN.textContent="("+undos+")";undoBtn.disabled=!undos||!history.length;}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on");},1800);}

function tap(i,d){if(!PortalKit.isPlaying()||busy)return;
  if(sel<0){if(tubes[i].length){sel=i;render();}return;}
  if(sel===i){sel=-1;render();return;}
  if(!canPour(tubes,sel,i)){d.classList.add("shake");setTimeout(function(){d.classList.remove("shake");},300);if(tubes[i].length){sel=i;}render();return;}
  history.push(clone(tubes));var color=POTIONS[tubes[sel][tubes[sel].length-1]];var from=shelf.children[sel].getBoundingClientRect(),to=d.getBoundingClientRect();
  pour(tubes,sel,i);sel=-1;stream(from,to,color);render();
  var t=tubes[i];if(t.length===CAP&&t.every(function(c){return c===t[0];}))burst(to.left+to.width/2,to.top,color);
  check();}
function check(){if(solved(tubes)){busy=true;var bonus=undos*10;PortalKit.addScore(100+bonus);toast(level+1<LEVELS?"Level cleared! +"+(100+bonus):"All potions sorted!");
    setTimeout(function(){busy=false;level++;if(level>=LEVELS){PortalKit.win(PortalKit.score,"You sorted all "+LEVELS+" potion racks.");}else newLevel();},1100);return;}
  if(!anyMove(tubes)){if(undos&&history.length)toast("No moves left. Undo or reset.");else{busy=true;setTimeout(function(){busy=false;PortalKit.lose(PortalKit.score,"The rack got stuck on level "+(level+1)+".");},700);}}}
function newLevel(){tubes=generate(COLORS_PER_LEVEL[level]);start=clone(tubes);history=[];sel=-1;undos=UNDOS;render();}
undoBtn.onclick=function(){if(!PortalKit.isPlaying()||!undos||!history.length)return;tubes=history.pop();undos--;sel=-1;render();};
document.getElementById("reset").onclick=function(){if(!PortalKit.isPlaying())return;tubes=clone(start);history=[];sel=-1;render();};

/* effects */
var fx=document.getElementById("fx"),fc=fx.getContext("2d"),parts=[];
var DPR=Math.min(devicePixelRatio||1,1.5),glow={};
function sizeFx(){fx.width=innerWidth*DPR;fx.height=innerHeight*DPR;fc.setTransform(DPR,0,0,DPR,0,0);}
function sprite(c){if(glow[c])return glow[c];var o=document.createElement("canvas");o.width=o.height=32;var x=o.getContext("2d"),g=x.createRadialGradient(16,16,0,16,16,16);g.addColorStop(0,"#fff");g.addColorStop(.18,c);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,32,32);return glow[c]=o;}
function stream(a,b,color){var x0=a.left+a.width/2,y0=a.top,x1=b.left+b.width/2,y1=b.top;for(var i=0;i<18;i++){parts.push({x:x0,y:y0,tx:x1,ty:y1+10,t:-i*0.035,c:color,k:"s"});}kick();}
function burst(x,y,c){for(var i=0;i<28;i++){var a=Math.random()*6.28,s=1+Math.random()*4;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c:c,k:"b"});}kick();}
var fxOn=false;function kick(){if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){fc.clearRect(0,0,innerWidth,innerHeight);if(!parts.length){fxOn=false;return;}fc.globalCompositeOperation="lighter";
  parts=parts.filter(function(p){if(p.k==="s"){p.t+=0.045;if(p.t<0)return true;if(p.t>1)return false;var t=p.t,x=p.x+(p.tx-p.x)*t,y=p.y+(p.ty-p.y)*t-Math.sin(t*Math.PI)*60;fc.drawImage(sprite(p.c),x-11,y-11,22,22);return true;}
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.02;if(p.life<=0)return false;fc.globalAlpha=p.life;fc.drawImage(sprite(p.c),p.x-8,p.y-8,16,16);fc.globalAlpha=1;return true;});
  fc.globalCompositeOperation="source-over";requestAnimationFrame(fxLoop);}

/* background: navy starfield, hex grid, rainbow light beams (style sheet, 17 Nov) */
var bg=document.getElementById("bg"),bc=bg.getContext("2d"),stars=[],base=document.createElement("canvas"),last=0;
function sizeBg(){var w=innerWidth,h=innerHeight;bg.width=w*DPR;bg.height=h*DPR;bc.setTransform(DPR,0,0,DPR,0,0);
  base.width=w*DPR;base.height=h*DPR;var b=base.getContext("2d");b.setTransform(DPR,0,0,DPR,0,0);
  var g=b.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0A1440");g.addColorStop(1,"#050A24");b.fillStyle=g;b.fillRect(0,0,w,h);
  b.strokeStyle="rgba(62,242,255,.06)";b.lineWidth=1;var s=34,hh=s*Math.sqrt(3)/2;b.beginPath();for(var y=0,r=0;y<h+s;y+=hh,r++)for(var x=(r%2)*s*1.5;x<w+s;x+=s*3){for(var k=0;k<6;k++){var a=k*Math.PI/3;b[k?"lineTo":"moveTo"](x+Math.cos(a)*s/2,y+Math.sin(a)*s/2);}b.closePath();}b.stroke();
  stars=[];for(var i=0;i<110;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.3,p:Math.random()*6});}
function bgLoop(t){requestAnimationFrame(bgLoop);if(document.hidden||t-last<33)return;last=t;var w=innerWidth,h=innerHeight;
  bc.drawImage(base,0,0,w,h);
  bc.globalCompositeOperation="lighter";[["rgba(139,92,246,.10)",0],["rgba(62,242,255,.09)",40],["rgba(124,255,107,.06)",80]].forEach(function(b){var x=w*.62+b[1]+Math.sin(t/4000)*20;bc.fillStyle=b[0];bc.beginPath();bc.moveTo(x,-10);bc.lineTo(x+70,-10);bc.lineTo(x-w*.5+70,h+10);bc.lineTo(x-w*.5,h+10);bc.fill();});bc.globalCompositeOperation="source-over";
  bc.fillStyle="#9FD8FF";stars.forEach(function(st){bc.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+st.p));bc.fillRect(st.x,st.y,st.r*1.6,st.r*1.6);});bc.globalAlpha=1;}
var rz;addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){sizeBg();sizeFx();},150);});sizeBg();sizeFx();requestAnimationFrame(bgLoop);

PortalKit.init({id:"potion-sort",title:"Potion Sort",color:"violet",goal:"Sort the glowing potions so every vial holds one color.",
  howTo:["Tap a vial, then tap another to pour its top color.","You can only pour onto the same color or into an empty vial.","Clear 10 racks to win. Unused undos give bonus points.","Out of moves with no undos left? The rack is stuck and the run ends."],
  onStart:function(){level=0;newLevel();},onRestart:function(){}});
render();
})();
</script>
</body>
</html>
