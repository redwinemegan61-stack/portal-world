<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Portal World · DevDreamAi by ConglomerateAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050A24;color:#EAF6FF;font-family:Inter,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:5}
#logo{font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:.08em;font-size:18px;text-shadow:0 0 10px #3EF2FF,0 0 22px #8B5CF6}
#logo span{color:#FF2E9A}
#hint{margin-left:auto;font-size:13px;opacity:.8;padding:6px 12px;border-radius:12px;background:rgba(10,20,64,.5);border:1px solid rgba(62,242,255,.35)}
#prompt{position:fixed;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 20px));transform:translateX(-50%);z-index:5;padding:14px 22px;border-radius:18px;text-align:center;background:linear-gradient(160deg,rgba(62,242,255,.12),rgba(139,92,246,.12));border:1px solid rgba(62,242,255,.6);box-shadow:0 0 22px rgba(62,242,255,.3);opacity:0;transition:opacity .25s;pointer-events:none;min-width:220px}
#prompt.on{opacity:1;pointer-events:auto}
#prompt b{display:block;font-family:Orbitron,sans-serif;font-size:20px;letter-spacing:.05em;margin-bottom:4px}
#prompt button{margin-top:8px;min-height:44px;min-width:44px;padding:10px 22px;border-radius:999px;border:1.5px solid var(--c,#3EF2FF);background:rgba(62,242,255,.08);color:#fff;font:700 14px Inter,sans-serif;cursor:pointer}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s;z-index:9}
#stick{position:fixed;left:24px;bottom:max(24px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(62,242,255,.45);background:rgba(10,20,64,.3);z-index:5;display:none}
#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(62,242,255,.35);box-shadow:0 0 14px #3EF2FF}
@media (pointer:coarse){#stick{display:block}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#050A24;z-index:10;font-family:Orbitron,sans-serif;letter-spacing:.1em;transition:opacity .6s}
#err{position:fixed;inset:auto 12px 12px;z-index:11;color:#ffb4c8;font-size:12px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script>
</head><body>
<div id="loading">ENTERING PORTAL WORLD…</div>
<div id="hud"><div id="logo">PORTAL<span>WORLD</span></div><div id="hint">Walk into a light pillar to play</div></div>
<div id="prompt"><b id="pname"></b><span id="pdesc"></span><br><button id="pgo">Enter portal</button></div>
<div id="stick"><i></i></div><div id="fade"></div><div id="err"></div>
<script type="module" src="./hub.js"></script>
<script>if(location.protocol==="file:")document.getElementById("loading").innerHTML='<div style="max-width:420px;padding:24px;text-align:center;line-height:1.6;font-family:Inter,sans-serif;letter-spacing:0">Browsers block 3D modules when a page is opened as a file.<br>Open it from GitHub Pages or a local server instead, for example <code>python3 -m http.server</code> in the portal-world folder.</div>';</script>
</body></html>
